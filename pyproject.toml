[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "averis"
version = "0.1.0"
description = "Shipping document verification hackathon workspace"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.12,<1"]

[project.scripts]
averis = "averis.cli:main"

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
