[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "averis"
version = "0.1.0"
description = "Shipping document verification hackathon workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "pydantic>=2,<3",
    "sqlalchemy>=2.0.54",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "boto3>=1.43.98",
    "google-cloud-tasks>=2.24.0",
    "google-auth>=2.58.0",
    "requests>=2.34.2",
    "typesafe-sdk>=0.7.0",
    "pdfplumber>=0.11.10",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "opencv-python-headless==5.0.0.93",
]

[tool.uv]
# RapidOCR uses OpenCV image operations only; the headless package supplies
# the same cv2 API without GUI libraries in server/worker containers.
exclude-dependencies = ["opencv-python"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.12,<1",
    "pyright>=1.1.414",
    "boto3-stubs[s3]>=1.43.98",
]

[project.scripts]
averis = "averis.cli:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["C901", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
