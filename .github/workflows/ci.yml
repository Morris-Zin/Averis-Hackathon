name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: averis
          POSTGRES_USER: averis
          POSTGRES_PASSWORD: averis
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U averis -d averis"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      AVERIS_ENV: test
      AVERIS_DATABASE_URL: postgresql+psycopg://averis:averis@localhost:5432/averis
      AVERIS_TEST_DATABASE_URL: postgresql+psycopg://averis:averis@localhost:5432/averis
      AVERIS_ORIGIN: http://localhost:8000
      AVERIS_STORAGE_BACKEND: local
      AVERIS_STORAGE_DIR: .local/ci-data
      AVERIS_TASKS_QUEUE: ""
      AVERIS_WORKER_URL: http://localhost:8001
      AVERIS_TASKS_SERVICE_ACCOUNT: ci@test.iam.gserviceaccount.com
      AVERIS_LIVE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --project backend --locked

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run repository verification
        run: uv run --project backend python scripts/verify.py
